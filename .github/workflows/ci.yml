# SPDX-License-Identifier: GPL-3.0-or-later
name: VMFS Common V2 recognition qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recognition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Libraries
          ref: 4ee7591678a44af92d94eec84a8e94ccd6349e37
          path: Libraries
          persist-credentials: false
      - name: Native Common V2 hosted and import-free checks
        run: |
          test "$(git hash-object Libraries/include/infiltratr/filesystem_module_v2.h)" = 90730b68a53ecf6a6e304c789501f29c17c728c7
          make check
      - name: Independent upstream VMFS3 captured image
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/glandium/vmfs-tools.git build/oracle
          git -C build/oracle checkout 4ab76ef5b074bdf06e4b518ff6d50439de05ae7f
          test "$(git -C build/oracle hash-object test.img)" = 0f2ec66491ec8dbf414c3acd3945182c5b910928
          cc -O2 -o build/imager build/oracle/imager/imager.c
          build/imager -x build/oracle/test.img > build/foreign.img
          sha256sum build/foreign.img > build/before
          VMFS_TRACE=1 build/test_vmfs ./build/VMFS.so build/foreign.img
          build/test_vmfs ./build/freestanding/VMFS.so build/foreign.img
          sha256sum -c build/before
      - name: Sanitizer qualification
        run: |
          make clean
          make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" check

  publish:
    needs: recognition
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Libraries
          ref: 4ee7591678a44af92d94eec84a8e94ccd6349e37
          path: Libraries
          persist-credentials: false
      - name: Build, test and publish the exact native provider
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Published version is immutable; increment VERSION for another release."
            exit 0
          fi
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          sh scripts/build-release.sh portable dist
          common=$(git -C Libraries rev-parse HEAD)
          curl -fsSL --retry 3 "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$GITHUB_SHA" -o "$work/source.tar.gz"
          curl -fsSL --retry 3 "https://codeload.github.com/Infiltrator-Projects/Libraries/tar.gz/$common" -o "$work/common.tar.gz"
          source_hash=$(sha256sum "$work/source.tar.gz" | cut -d' ' -f1)
          common_hash=$(sha256sum "$work/common.tar.gz" | cut -d' ' -f1)
          run="dist/filesystem-vmfs-$version-native-installer.run"
          sed -e "s/@SOURCE@/$GITHUB_SHA/g" -e "s/@COMMON@/$common/g" -e "s/@SOURCE_HASH@/$source_hash/g" -e "s/@COMMON_HASH@/$common_hash/g" -e "s/@VERSION@/$version/g" scripts/installer.in > "$run"
          chmod +x "$run"
          "$run" --profile aggressive --system-package-mode --build-only --output "$work/native"
          deb="infiltrator-filesystem-vmfs_${version}_amd64.deb"
          pdf="System/Resources/Documentation/Filesystem-VMFS.pdf"
          so="System/Filesystems/VMFS.so"
          for package in "dist/$deb" "$work/native/$deb"; do
            test "$(dpkg-deb -f "$package" Package)" = 'infiltrator-filesystem-vmfs'
            test "$(dpkg-deb -f "$package" Version)" = "$version"
            test "$(dpkg-deb -f "$package" Architecture)" = amd64
            expected=$(printf './%s\n' "$pdf" "$so" | sort)
            actual=$(dpkg-deb --fsys-tarfile "$package" | tar -tf - | grep -v '/$' | sort)
            test "$actual" = "$expected"
            dpkg-deb -x "$package" "$work/extract"
            cmp "docs/VMFS.pdf" "$work/extract/$pdf"
            test "$(nm -D --defined-only "$work/extract/$so" | awk '{print $3}')" = infiltrator_filesystem_api_v2
          done
          test ! -e "/$pdf"
          test ! -e "/$so"
          sudo dpkg -i "$work/native/$deb"
          cmp "docs/VMFS.pdf" "/$pdf"
          cmp "$work/extract/$so" "/$so"
          sudo dpkg --purge infiltrator-filesystem-vmfs
          test ! -e "/$pdf"
          test ! -e "/$so"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          gh release create "v$version" --target "$GITHUB_SHA" --title "VMFS v$version" --notes "Bounded single-extent VMFS3 direct-block read-only reader. Native FDC/FBB allocation validation and namespace. Captured independent VMFS3 image and populated structural fixtures passed; VMFS5 recognition only, authentic VMFS5/6 media, indirect/subblock support, mutation and physical BOOT remain unqualified." "dist/$deb" "$run"
